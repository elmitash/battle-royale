{{define "content"}}
<h2>진행상황 (뉴스 로그)</h2>
<table class="br-table">
  <tr><th>시각</th><th>구분</th><th>내용</th></tr>
  {{range .Logs}}
  <tr>
    <td style="white-space:nowrap;">{{formatTime .CreatedAt}}</td>
    <td class="cent">{{.Kind}}</td>
    <td>{{.Message}}</td>
  </tr>
  {{else}}
  <tr><td colspan="3" class="cent">기록된 진행상황이 없습니다.</td></tr>
  {{end}}
</table>
{{end}}
