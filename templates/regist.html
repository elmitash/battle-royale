{{define "content"}}
<h2>전학수속 (신규 등록)</h2>
<p>전학 수속을 완료하면 무작위 반·번호·동아리와 초기 무기·지급품이 배정되며 프로그램에 참가하게 됩니다.</p>
{{if .Error}}
<div class="br-error">{{.Error}}</div>
{{end}}
<form method="POST" action="/regist">
  <table class="br-table" style="max-width: 640px;">
    <tr><th>ID</th><td><input type="text" name="id" required maxlength="16"></td></tr>
    <tr><th>비밀번호</th><td><input type="password" name="password" required></td></tr>
    <tr>
      <th>성별</th>
      <td>
        <label><input type="radio" name="sex" value="남성" checked onchange="onSexChange()"> 남성</label>
        <label><input type="radio" name="sex" value="여성" onchange="onSexChange()"> 여성</label>
      </td>
    </tr>
    <tr>
      <th>성 / 이름</th>
      <td>
        <div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center;">
          <input type="text" id="first_name" name="first_name" required maxlength="10" placeholder="성" style="width:90px;">
          <input type="text" id="last_name" name="last_name" required maxlength="10" placeholder="이름" style="width:110px;">
          <button type="button" onclick="fillRandomName('kr')">한국 이름 랜덤</button>
          <button type="button" onclick="fillRandomName('jp')">일본 이름 랜덤</button>
        </div>
      </td>
    </tr>
    <tr>
      <th>아이콘</th>
      <td>
        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          <img id="icon-preview" src="/static/img/0.jpg" alt="아이콘 미리보기" width="70" height="70" style="border:1px solid #666;">
          <div>
            <select id="icon-select" name="icon" onchange="updateIconPreview()">
              {{range .Icons}}
              <option value="{{.ID}}">{{.Name}} ({{.Sex}})</option>
              {{end}}
            </select>
            <div style="margin-top:6px;">
              <button type="button" onclick="toggleIconGallery()">전체 아이콘 펼쳐보기</button>
            </div>
          </div>
        </div>
        <div id="icon-gallery" style="display:none; margin-top:10px; max-height:280px; overflow-y:auto; border:1px solid #444; padding:6px;">
          <div style="display:flex; flex-wrap:wrap; gap:6px;">
            {{range .Icons}}
            <div onclick="selectIcon({{.ID}}, '{{.Sex}}')" style="cursor:pointer; text-align:center; width:62px;" title="{{.Name}} ({{.Sex}})">
              <img src="/static/img/{{.ID}}.jpg" width="56" height="56" style="border:1px solid #555; display:block; margin:0 auto;">
              <span class="8">{{.Name}}</span>
            </div>
            {{end}}
          </div>
        </div>
      </td>
    </tr>
    <tr>
      <td colspan="2" class="cent"><button type="submit">전학수속 완료</button></td>
    </tr>
  </table>
</form>

function getSelectedSex() {
  const checked = document.querySelector('input[name="sex"]:checked');
  return checked ? checked.value : "남성";
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function fillRandomName(origin) {
  const sex = getSelectedSex();
  if (origin === 'all') {
    origin = Math.random() < 0.5 ? 'kr' : 'jp';
  }
  if (origin === 'kr') {
    document.getElementById('first_name').value = pickRandom(krSurnames);
    document.getElementById('last_name').value = pickRandom(sex === '남성' ? krMaleGiven : krFemaleGiven);
  } else {
    document.getElementById('first_name').value = pickRandom(jpSurnames);
    document.getElementById('last_name').value = pickRandom(sex === '남성' ? jpMaleGiven : jpFemaleGiven);
  }
}

function updateIconPreview() {
  const sel = document.getElementById('icon-select');
  document.getElementById('icon-preview').src = '/static/img/' + sel.value + '.jpg';
}

function selectIcon(id, sex) {
  document.getElementById('icon-select').value = String(id);
  const radio = document.querySelector('input[name="sex"][value="' + sex + '"]');
  if (radio) radio.checked = true;
  updateIconPreview();
}

function onSexChange() {
  const sex = getSelectedSex();
  const sel = document.getElementById('icon-select');
  const cur = parseInt(sel.value, 10);
  if (sex === '남성' && cur >= 21) {
    sel.value = String(Math.floor(Math.random() * 21));
  } else if (sex === '여성' && cur < 21) {
    sel.value = String(21 + Math.floor(Math.random() * 21));
  }
  updateIconPreview();
  fillRandomName('all');
}

function toggleIconGallery() {
  const g = document.getElementById('icon-gallery');
  g.style.display = (g.style.display === 'none') ? 'block' : 'none';
}

document.addEventListener('DOMContentLoaded', function () {
  fillRandomName('all');
  updateIconPreview();
});
</script>
